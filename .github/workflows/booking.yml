name: Booking CI and delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: booking_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_DATABASE_URL: postgres://postgres:ci_only@localhost:5432/booking_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - name: Check concurrent booking and retry on PostgreSQL
        run: node backend/ci/postgres.js
      - uses: docker/setup-buildx-action@v3
      - name: Build the release candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tatkal-shield:candidate
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the candidate for fixable high and critical vulnerabilities
        run: |
          docker save -o /tmp/booking-candidate.tar tatkal-shield:candidate
          docker run --rm -v /tmp/booking-candidate.tar:/scan/image.tar:ro aquasec/trivy:0.76.2 image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Deploy to temporary staging and check service readiness
        env:
          BOOKING_IMAGE: tatkal-shield:candidate
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl -fsS http://localhost:3011/api/health | jq -e --arg sha "$GITHUB_SHA" '.status=="ok" and .storage=="postgres" and .release==$sha'
          curl -fsS http://localhost:3011/ > /dev/null
      - name: Run desktop and mobile group checkout against the staging image
        env:
          BROWSER_STAGING_ORIGIN: http://localhost:3011
        run: npm run test:browser
      - name: Verify asynchronous booking projection
        env:
          BOOKING_IMAGE: tatkal-shield:candidate
        run: |
          for attempt in {1..15}; do
            result=$(docker compose exec -T db psql -U tatkal -d booking -Atc 'SELECT count(*) > 0 AND count(*) = (SELECT count(*) FROM booking_outbox) FROM booking_event_projection')
            if [ "$result" = t ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Report staging state and clean up
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 80
          docker compose down --volumes
      - name: Export tested image for delivery
        if: github.event_name == 'push'
        run: docker save tatkal-shield:candidate | gzip > /tmp/booking-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tested-image
          path: /tmp/booking-image.tar.gz
          retention-days: 1
  deliver:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
      - name: Deliver verified commit to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i booking-image.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker tag tatkal-shield:candidate "$image"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          printf 'Published container image `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
